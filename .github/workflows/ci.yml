name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python3 scripts/test_setup.py
      - run: python3 scripts/check_docs.py
      - run: docker compose config --quiet
  containers:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Authenticate publisher
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build native image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: is373-test:latest
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test the actual runtime image
        run: python3 scripts/check_container.py is373-test:latest
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/is373-rust-rag:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
  publish:
    if: github.event_name != 'pull_request'
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/is373-rust-rag
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble tested AMD64 and ARM64 images
        shell: bash
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(--tag "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(--tag "$IMAGE:$GITHUB_REF_NAME"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
